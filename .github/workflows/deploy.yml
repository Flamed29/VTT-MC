# Deploy manuale su GitHub Pages — branch android-port
# NON è automatico: va eseguito manualmente solo dopo test e approvazione sul dispositivo fisico.
# Per avviarlo: GitHub → Actions → "Deploy Android Port to GitHub Pages" → Run workflow

name: Deploy Android Port to GitHub Pages

on:
  workflow_dispatch: # Solo manuale — mai automatico

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout android-port
        uses: actions/checkout@v4
        with:
          ref: android-port

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: android
